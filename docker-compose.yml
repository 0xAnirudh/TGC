# Local development stores.
#
# Mongo and Redis only. The API, relay and jobs run on the host under
# `npm run dev` so a code change is a restart, not a rebuild. Production
# Dockerfiles for those arrive in Phase 15.

services:
  mongo:
    image: mongo:7
    container_name: tgc-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: tgc-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    # appendonly with appendfsync everysec.
    #
    # This is the durability trade-off the architecture rests on, made
    # explicit rather than inherited from a default. User cash and live
    # supply are in Redis, so an unclean shutdown can lose up to one
    # second of trades. `always` would make that window zero at a
    # significant write-latency cost, which NFR-2 cannot absorb.
    #
    # What makes `everysec` acceptable is the Phase 6 rebuild path: the
    # trade ledger is a Redis stream projected into Mongo, so anything
    # lost in that window is replayable from Mongo rather than gone.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
