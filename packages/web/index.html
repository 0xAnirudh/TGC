<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>General Company</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces, each doing one job.

      Fraunces  display serif with optical sizing, for mastheads and
                headings. Carries the ledger-and-broadsheet character
                that the rest of the interface is quiet enough to let
                through.
      Inter     interface text. Neutral on purpose - it should not
                compete with the serif or with the numbers.
      JetBrains Mono  every numeral in the application. Monospaced with
                tabular figures, so a column of prices aligns on the
                decimal and a changing digit does not reflow the row.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
