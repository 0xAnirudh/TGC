# Render deployment.
#
# One web service running the API with the relay and job runner embedded.
#
# They are separate processes by design - see docs/ARCHITECTURE.md - and
# they run separately in development. They are co-located here because
# Render's free tier has no background workers; those start at $7/month
# each. Nothing in the code changes: both workers already export start()
# and only self-launch as a process entry point, so EMBED_WORKERS is a
# deployment switch, not a different build.
#
# To split them properly later: set EMBED_WORKERS=false and add two
# `type: worker` services running `npm start --workspace=@tgc/relay` and
# `npm start --workspace=@tgc/jobs`.

services:
  - type: web
    name: tgc-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start --workspace=@tgc/api
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMBED_WORKERS
        value: 'true'

      # Job cadence, slowed for the hosted Redis command quota.
      #
      # The development defaults - drift every minute, revaluation every
      # two - issue roughly 47 Redis commands a minute while completely
      # idle, or about 68,000 a day. Upstash's free tier allows 500,000 a
      # MONTH, so the defaults would exhaust it in a week with nobody
      # playing. See docs/DEPLOYMENT.md for the arithmetic.
      - key: DRIFT_CRON
        value: '*/5 * * * *'
      - key: REVALUE_CRON
        value: '*/10 * * * *'
      - key: NEWSPAPER_CRON
        value: '0 */6 * * *'
      - key: RELAY_BLOCK_MS
        value: '30000'

      # Set these in the Render dashboard, not here. Never commit them.
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
